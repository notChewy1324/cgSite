<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- background plate -->
  <rect width="64" height="64" rx="8" fill="#050608"/>

  <!-- subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="6" fill="none" stroke="#1d3a5f" stroke-width="1" opacity="0.6"/>

  <!-- corner brackets (operator-card style) -->
  <g stroke="#6ba3d8" stroke-width="2" fill="none" stroke-linecap="square">
    <!-- top-left -->
    <path d="M 8 14 L 8 8 L 14 8"/>
    <!-- top-right -->
    <path d="M 50 8 L 56 8 L 56 14"/>
    <!-- bottom-left -->
    <path d="M 8 50 L 8 56 L 14 56"/>
    <!-- bottom-right -->
    <path d="M 50 56 L 56 56 L 56 50"/>
  </g>

  <!-- CG initials -->
  <text x="32" y="42"
        text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="26"
        letter-spacing="1"
        fill="#8fc0e8">CG</text>

  <!-- tiny accent dot -->
  <circle cx="32" cy="52" r="1.4" fill="#2dd4bf"/>
</svg>
